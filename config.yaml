# ============================================================
# 每日热点日报 配置文件
# 改完保存即可，下次运行（本地或 GitHub Actions）自动生效
# ============================================================

# 时区（用于"今天"的判定与日报标题）
timezone: Asia/Shanghai

# 各数据源：enabled 开关 / top_n 取前几条 / tag 用于微信卡片摘要里的【标签】
sources:
  # ---------- 国内新闻日报 ----------
  yaowen:            # 每天60秒读懂世界（国内要闻速览，每天固定15条，纯文本无链接）
    enabled: true
    top_n: 15
    tag: 要闻
  weibo:             # 微博热搜
    enabled: true
    top_n: 10
    tag: 微博
  zhihu:             # 知乎热榜
    enabled: true
    top_n: 10
    tag: 知乎
  baidu:             # 百度热搜
    enabled: true
    top_n: 10
    tag: 百度
  toutiao:           # 今日头条热榜
    enabled: true
    top_n: 10
    tag: 头条
  douyin:            # 抖音热点（默认关，想看改 true）
    enabled: false
    top_n: 10
    tag: 抖音
  bilibili:          # B站热榜（默认关，想看改 true）
    enabled: false
    top_n: 10
    tag: B站
  wechat_hot:        # 微信 24h 热文榜（点开直接是公众号文章）
    enabled: true
    top_n: 8
    tag: 微信热文
  ithome:            # IT之家（数码科技资讯）
    enabled: true
    top_n: 8
    tag: IT之家
  sspai:             # 少数派（效率工具/数字生活）
    enabled: true
    top_n: 8
    tag: 少数派
  kr36:              # 36氪热榜（商业科技/创投）
    enabled: true
    top_n: 8
    tag: 36氪

  # ---------- 每日 AI 快报 ----------
  qbitai:            # 量子位（官方 RSS）
    enabled: true
    top_n: 8
    tag: 量子位
  aibase:            # AIbase AI 日报（中文）
    enabled: true
    top_n: 8
    tag: AI快讯
  jiqizhixin:        # 机器之心（依赖海外聚合实例，国内不稳，默认关）
    enabled: false
    top_n: 8
    tag: 机器之心
  vendor_blogs:      # 大厂官方博客（OpenAI/Anthropic/DeepMind/HuggingFace，多源合并）
    enabled: true
    top_n: 8
    tag: 大厂官博
  hf_papers:         # HuggingFace 热门论文
    enabled: true
    top_n: 5
    tag: HF论文
  hf_releases:       # 开源模型发布（HF 上 DeepSeek/智谱/通义/Kimi 等组织的新模型）
    enabled: true
    top_n: 8
    tag: 模型发布
  vendor_news:       # 大模型厂商动态（360资讯按 vendor_keywords 关键词抓取）
    enabled: true
    top_n: 8
    tag: 厂商动态
  hn:                # Hacker News 首页（全球技术社区）
    enabled: true
    top_n: 8
    tag: HN
  reddit:            # Reddit AI 社区（r/LocalLLaMA + r/MachineLearning）
    enabled: true
    top_n: 8
    tag: Reddit
  baai:              # 智源社区·最热
    enabled: true
    top_n: 8
    tag: 智源
  juejin_ai:         # 掘金·人工智能本周最热
    enabled: true
    top_n: 8
    tag: 掘金AI
  github_trending:   # GitHub Trending（倾向筛选 AI 相关仓库）
    enabled: true
    top_n: 5
    tag: GitHub

# ---- 大模型厂商动态（思路一：关键词资讯，360资讯搜索）----
vendor_keywords:
  - DeepSeek
  - 智谱
  - Kimi
  - 通义千问
  - 豆包
  - 文心一言

# ---- 开源模型发布（思路二：HF 组织监控）----
hf_orgs:
  - deepseek-ai      # DeepSeek
  - THUDM            # 智谱 GLM
  - Qwen             # 阿里通义
  - moonshotai       # 月之暗面 Kimi

# Reddit 订阅的子版
reddit_subs:
  - LocalLLaMA
  - MachineLearning

# DailyHotApi 公共实例（兜底聚合源，自上而下依次尝试）
dailyhot_instances:
  - https://api-hot.imsyy.top

# 60s API 公共实例（国内要闻/微博兜底）
sixty_instances:
  - https://60s.b23.run
  - https://60s.viki.moe

# 微信卡片摘要的排版参数
digest:
  # 每个版块在卡片里展示几条
  items_per_section: 3
  # 单条标题最多截断多少字
  max_title_chars: 20
  # 摘要总字数上限（模板消息安全长度）
  max_chars: 480

# GitHub 发布 / 去重（gh_repo 填 "用户名/仓库名"，本地跑也用于查重与git推送目标）
publish:
  gh_repo: ""          # 例: zhangsan/news-daily
  branch: main
  docs_dir: docs
  # GitHub Pages 首页（开好 Pages 后填，例: https://zhangsan.github.io/news-daily）
  # 微信卡片"点击查看完整日报"会跳到 pages_url + 当日文件名
  pages_url: ""
